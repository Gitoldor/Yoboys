<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Media Posts</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: #0a0a0a;
      color: white;
    }

    .post-card {
      background: #151515;
      border: 1px solid #262626;
    }
  </style>
</head>

<body>

  <main class="max-w-2xl mx-auto p-4">

    <h1 class="text-2xl font-bold mb-6">
      Posts
    </h1>

    <!-- Posts will appear here -->
    <div id="postsContainer" class="space-y-4"></div>

  </main>


  <!-- Your data -->
  <script src="data.js"></script>


  <script>

    const postsContainer =
      document.getElementById("postsContainer");


    // --------------------------------------------------
    // GET YOUTUBE VIDEO ID
    // --------------------------------------------------

    function getYouTubeID(url) {

      try {

        const parsedURL = new URL(url);

        // youtube.com/watch?v=XXXXXXXX
        if (parsedURL.hostname.includes("youtube.com")) {
          return parsedURL.searchParams.get("v");
        }

        // youtu.be/XXXXXXXX
        if (parsedURL.hostname.includes("youtu.be")) {
          return parsedURL.pathname.substring(1);
        }

      } catch (error) {

        console.error("Invalid YouTube URL:", url);

      }

      return null;
    }


    // --------------------------------------------------
    // CREATE UNIQUE SHARE LINK
    // --------------------------------------------------

    function getPostLink(post) {

      const currentURL =
        new URL(window.location.href);

      // Remove any existing post parameter
      currentURL.search = "";

      // Add this post's unique ID
      currentURL.searchParams.set("post", post.id);

      return currentURL.toString();
    }


    // --------------------------------------------------
    // SHARE POST
    // --------------------------------------------------

    async function sharePost(post) {

      const postLink = getPostLink(post);

      try {

        // Native mobile share
        if (navigator.share) {

          await navigator.share({
            title: post.title,
            text: post.title,
            url: postLink
          });

        } else {

          // Fallback: copy link
          await navigator.clipboard.writeText(postLink);

          alert("Post link copied!");

        }

      } catch (error) {

        // User cancelled native share
        console.log("Share cancelled");

      }

    }


    // --------------------------------------------------
    // FIND POST FROM URL
    // --------------------------------------------------

    function getPostFromURL() {

      const params =
        new URLSearchParams(window.location.search);

      const postID =
        params.get("post");

      if (!postID) {
        return null;
      }

      return mediaData.find(
        post => post.id === postID
      );

    }


    // --------------------------------------------------
    // CREATE POST CARD
    // --------------------------------------------------

    function createPost(post) {

      const youtubeID =
        getYouTubeID(post.url);

      const card =
        document.createElement("article");

      card.className =
        "post-card rounded-2xl overflow-hidden";


      // YouTube embed
      let videoHTML = "";

      if (youtubeID) {

        videoHTML = `
          <div class="aspect-video bg-black">

            <iframe
              class="w-full h-full"
              src="https://www.youtube.com/embed/${youtubeID}"
              title="${escapeHTML(post.title)}"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen>
            </iframe>

          </div>
        `;

      }


      card.innerHTML = `

        ${videoHTML}

        <div class="p-4">

          <h2 class="text-lg font-semibold">
            ${escapeHTML(post.title)}
          </h2>

          <p class="text-sm text-gray-400 mt-2">
            📍 ${escapeHTML(post.location || "Unknown location")}
          </p>

          <div class="flex gap-2 mt-4">

            <button
              class="shareButton flex-1 bg-white text-black py-3 rounded-xl font-medium"
            >
              Share
            </button>

            <button
              class="openButton px-5 py-3 rounded-xl bg-[#252525]"
            >
              Open
            </button>

          </div>

        </div>
      `;


      // Share button
      card
        .querySelector(".shareButton")
        .addEventListener("click", () => {

          sharePost(post);

        });


      // Open unique URL
      card
        .querySelector(".openButton")
        .addEventListener("click", () => {

          const link =
            getPostLink(post);

          window.location.href = link;

        });


      return card;

    }


    // --------------------------------------------------
    // SECURITY: ESCAPE HTML
    // --------------------------------------------------

    function escapeHTML(value) {

      const div =
        document.createElement("div");

      div.textContent =
        value ?? "";

      return div.innerHTML;

    }


    // --------------------------------------------------
    // RENDER POSTS
    // --------------------------------------------------

    function renderPosts() {

      postsContainer.innerHTML = "";

      const selectedPost =
        getPostFromURL();


      // ----------------------------------------------
      // UNIQUE POST URL
      // ----------------------------------------------

      if (selectedPost) {

        postsContainer.appendChild(
          createPost(selectedPost)
        );

        document.title =
          selectedPost.title;

        return;

      }


      // ----------------------------------------------
      // NORMAL HOME PAGE
      // ----------------------------------------------

      mediaData.forEach(post => {

        postsContainer.appendChild(
          createPost(post)
        );

      });

    }


    // Start
    renderPosts();

  </script>

</body>
</html>
